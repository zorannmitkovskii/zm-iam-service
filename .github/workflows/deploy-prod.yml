name: Deploy IAM to DigitalOcean (Prod)

# Same shape as deploy-test.yml — differences:
#   - triggers on main (production branch)
#   - uses DROPLET_IP_PROD secret
#   - SPRING_PROFILES_ACTIVE=prod
#   - environment: production gate (reviewers required)

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: zmtechlabs/zm-iam-service:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    # Manual approval gate. Configure reviewers in:
    #   Settings → Environments → `production` → Required reviewers.
    # Consider adding a 5-min wait timer for last-minute cancellation.
    environment: production
    steps:
      - name: Deploy IAM (PROD)
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.DROPLET_IP_PROD }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e

            echo "🔧 Ensure ivy-net network exists"
            docker network inspect ivy-net >/dev/null 2>&1 || docker network create ivy-net

            echo "🗄️ Ensure iam_db + iam_user exist on shared Postgres"
            # Idempotent — never touches an existing role/database, only
            # creates what's missing. Safe against a prod DB with real data.
            # psql :'var' substitution does NOT work inside DO $$ ... $$
            # blocks. Use \gexec for both role + database checks.
            docker exec -i -u postgres "${{ secrets.POSTGRES_CONTAINER_PROD || 'zm-postgres' }}" \
              psql -U postgres -v ON_ERROR_STOP=1 \
              -v iam_user="${{ secrets.IAM_DB_USER_PROD || 'iam_user' }}" \
              -v iam_password="${{ secrets.IAM_DB_PASSWORD_PROD || 'iam_pass' }}" \
              -v iam_db="${{ secrets.IAM_DB_NAME_PROD || 'iam_db' }}" <<'SQL'
            SELECT format('CREATE ROLE %I WITH LOGIN PASSWORD %L', :'iam_user', :'iam_password')
            WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'iam_user')\gexec

            SELECT format('CREATE DATABASE %I OWNER %I', :'iam_db', :'iam_user')
            WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'iam_db')\gexec
            SQL

            echo "⬇️ Pull latest IAM image"
            docker pull zmtechlabs/zm-iam-service:latest

            echo "🛑 Stop IAM (prod)"
            docker stop ivy-iam || true

            echo "🗑 Remove old container (prod)"
            docker rm ivy-iam || true

            echo "🚀 Start IAM (prod)"
            docker run -d \
              --name ivy-iam \
              --network ivy-net \
              --env-file /opt/ivy-events/env/iam.env \
              -p 8383:8383 \
              -e SPRING_PROFILES_ACTIVE=prod \
              zmtechlabs/zm-iam-service:latest

            echo "✅ IAM (prod) deployed successfully"
