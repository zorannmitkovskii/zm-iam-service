name: Deploy IAM to DigitalOcean (Prod)

# Same shape as deploy-test.yml — differences:
#   - triggers on main (production branch)
#   - uses DROPLET_IP_PROD secret
#   - SPRING_PROFILES_ACTIVE=prod
#   - environment: production gate (reviewers required)

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            zmtechlabs/zm-iam-service:latest
            zmtechlabs/zm-iam-service:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    # Manual approval gate. Configure reviewers in:
    #   Settings → Environments → `production` → Required reviewers.
    # Consider adding a 5-min wait timer for last-minute cancellation.
    environment: production
    steps:
      - name: Deploy IAM (PROD)
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.DROPLET_IP_PROD }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e

            echo "🔧 Ensure ivy-net network exists"
            docker network inspect ivy-net >/dev/null 2>&1 || docker network create ivy-net

            echo "⬇️ Pull IAM image"
            docker pull zmtechlabs/zm-iam-service:${{ github.sha }}

            echo "🛑 Stop IAM (prod)"
            docker stop ivy-iam || true

            echo "🗑 Remove old container (prod)"
            docker rm ivy-iam || true

            echo "🚀 Start IAM (prod)"
            docker run -d \
              --name ivy-iam \
              --network ivy-net \
              --restart unless-stopped \
              --env-file /opt/ivy-events/env/iam.env \
              -p 127.0.0.1:8383:8383 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e SERVER_PORT=8383 \
              -e 'SPRING_APPLICATION_JSON={"iam.public-auth.origin-to-realm":{"ivyevents.mk":"event-app","www.ivyevents.mk":"event-app"}}' \
              -e IAM_PROVISIONING_SECURITY_ENABLED=false \
              --health-cmd 'curl -fsS http://localhost:8383/actuator/health/liveness || exit 1' \
              --health-interval 15s \
              --health-start-period 45s \
              --health-retries 5 \
              zmtechlabs/zm-iam-service:${{ github.sha }}

            echo "✅ IAM (prod) deployed successfully"
