spring:
  application:
    name: zm-iam-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: iam-hikari
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8383}
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

# ── Keycloak integration ─────────────────────────────────────────────
# All fields sanitized at startup (see KeycloakProperties.normalize()) so
# trailing whitespace / stray quotes in the env vars don't produce 401s.
iam:
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    admin-realm: ${KEYCLOAK_ADMIN_REALM:master}
    self-bootstrap-enabled: ${IAM_SELF_BOOTSTRAP_ENABLED:true}
    zm-services-realm: ${IAM_ZM_SERVICES_REALM:zm-services}
    iam-client-role: ${IAM_IAM_CLIENT_ROLE:iam-client}
  # IAM-09 resource-server config. The issuer URI defaults to the
  # zm-services realm on the Keycloak configured above; override only
  # when the Keycloak host published to /internal callers differs from
  # the host IAM uses for admin API calls (rare — usually only in test
  # container environments where the issuer inside the token is
  # container-local while the JWKS discovery URL is host-mapped).
  security:
    internal:
      issuer-uri: ${IAM_INTERNAL_ISSUER_URI:}

  # ── Outbound email (ZeptoMail HTTP API) ──────────────────────────────
  # Real transactional email for public-auth verification / password-reset
  # codes. Defaults baked in so IAM sends out of the box — no env needed.
  # Override via env only if the ZeptoMail account/sender changes; set
  # enabled=false (see application-local.yml) to log the code in local dev.
  email:
    zepto:
      enabled: ${IAM_ZEPTO_ENABLED:true}
      token: ${ZEPTO_TOKEN:Zoho-enczapikey yA6KbHsLuguiy2IGSBFsh5eJpYk3/qo8iSqwtC7gKMwnLtLli6E50EI+K4HoITaMj4WEs61RbNkRcYCx69wNepVnYYJZLJTGTuv4P2uV48xh8ciEYNYvgZWpC7MQE6VMeB8hDC05T/YnWA==}
      from-address: ${ZEPTO_FROM_ADDRESS:noreply@ivyevents.mk}
      from-name: ${ZEPTO_FROM_NAME:Ivy Events}
      base-url: ${ZEPTO_BASE_URL:https://api.zeptomail.eu}

  # ── Public-auth: realm → public Keycloak client for the ROPC (password)
  #    grant. The client MUST have "Direct Access Grants" enabled in Keycloak.
  public-auth:
    realm-client-ids:
      event-app: ${IAM_EVENT_APP_CLIENT_ID:eventFE}
