spring:
  application:
    name: zm-iam-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: iam-hikari
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Kafka producer — only used when iam.notifications.via-events=true. Lazy:
  # no connection is made until an event is actually published, so IAM boots
  # fine in environments without Kafka (via-events stays false there).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

server:
  port: ${SERVER_PORT:8383}
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

# ── Keycloak integration ─────────────────────────────────────────────
# All fields sanitized at startup (see KeycloakProperties.normalize()) so
# trailing whitespace / stray quotes in the env vars don't produce 401s.
iam:
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    admin-realm: ${KEYCLOAK_ADMIN_REALM:master}
    self-bootstrap-enabled: ${IAM_SELF_BOOTSTRAP_ENABLED:true}
    zm-services-realm: ${IAM_ZM_SERVICES_REALM:zm-services}
    iam-client-role: ${IAM_IAM_CLIENT_ROLE:iam-client}
  # IAM-09 resource-server config. The issuer URI defaults to the
  # zm-services realm on the Keycloak configured above; override only
  # when the Keycloak host published to /internal callers differs from
  # the host IAM uses for admin API calls (rare — usually only in test
  # container environments where the issuer inside the token is
  # container-local while the JWKS discovery URL is host-mapped).
  security:
    internal:
      issuer-uri: ${IAM_INTERNAL_ISSUER_URI:}

  # ── Public-auth: realm → public Keycloak client for the ROPC (password)
  #    grant. The client MUST have "Direct Access Grants" enabled in Keycloak.
  public-auth:
    realm-client-ids:
      event-app: ${IAM_EVENT_APP_CLIENT_ID:eventFE}

  # Route public-auth emails through zm-notification-service (Kafka event)
  # instead of sending inline. Default false = inline EmailSender (safe where
  # Kafka isn't deployed yet); set true where Kafka + the service are live.
  notifications:
    via-events: ${IAM_NOTIFICATIONS_VIA_EVENTS:false}

# Topic zm-notification-service consumes.
notification:
  topic: ${NOTIFICATION_TOPIC:zm.notifications.v1}

# ── The business registry (organizer signup) ─────────────────────────
# Where to create the organization behind an organizer account. Unset means an
# organizer signup fails loudly at verification, rather than producing an account
# that looks complete and cannot open a single agency screen.
org:
  service:
    base-url: ${ORG_BASE_URL:}
    # Client credentials for the services realm. IAM has no service identity of
    # its own today — it is the thing that provisions them for everyone else —
    # so this must be pointed at a client that carries org-service's
    # `org-client` role. Unset means organizer signup fails loudly at
    # verification; personal signup, login and password reset are unaffected.
    token-url: ${ORG_TOKEN_URL:}
    client-id: ${ORG_CLIENT_ID:}
    client-secret: ${ORG_CLIENT_SECRET:}
